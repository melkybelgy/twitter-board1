<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Draw on the Banner</title>
<style>
:root{--bg:#f6f6f4;--fg:#1a1a1a;--card:#fff;--line:#d8d8d2;--acc:#1d9bf0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#111;--fg:#f0f0ee;--card:#1c1c1c;--line:#333}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
h1{font-size:clamp(48px,13vw,144px);line-height:1;margin:0 0 10px;letter-spacing:-.03em}
.sub{opacity:.7;margin:0 0 14px;font-size:clamp(16px,2.2vw,22px)}
.wrap{max-width:1500px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
input[type=number],input[type=text],input[type=password]{font:inherit;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
input[type=number]{width:64px}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw.on{outline:3px solid var(--acc);outline-offset:1px}
#stage{border:1px solid var(--line);border-radius:6px;overflow:auto;max-height:75vh;background:#fff;line-height:0}
canvas{image-rendering:pixelated;width:100%;height:auto;aspect-ratio:3/1;touch-action:none;cursor:crosshair;display:block}
canvas.locked{cursor:not-allowed}
#status{font-weight:600}
.warn{color:#c0392b}
.hide,#gate.hide{display:none}
#gate{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
#gate .card{max-width:380px;width:100%;padding:20px}
#gate h2{margin:0 0 6px;font-size:26px}
#board ol{margin:6px 0 0;padding-left:26px}
#board li{padding:2px 0}
#board .n{float:right;font-variant-numeric:tabular-nums;opacity:.8}

(function(){

// ---- Firebase Realtime Database over plain HTTPS (no SDK, no sign-in)
function api(path,method,body,auth){
  function go(tok){
    var ctl=window.AbortController?new AbortController():null,t=ctl?setTimeout(function(){ctl.abort()},15000):null;
    return fetch(DB+path+'.json'+(tok?'?auth='+encodeURIComponent(tok):''),{method:method||'GET',body:body===undefined?undefined:JSON.stringify(body),signal:ctl?ctl.signal:undefined})
      .then(function(r){clearTimeout(t);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()},
            function(er){clearTimeout(t);throw new Error(er&&er.name==='AbortError'?'timed out':'request blocked or offline')});
  }
  return auth?getToken().then(go):go();
}
function setAt(root,path,val){
  var p=path.split('/').filter(Boolean);
  if(!p.length)return val==null?{}:val;
  var o=root;
  for(var i=0;i<p.length-1;i++){if(typeof o[p[i]]!=='object'||o[p[i]]===null)o[p[i]]={};o=o[p[i]]}
  if(val==null)delete o[p[p.length-1]];else o[p[p.length-1]]=val;
  return root;
}
function stream(path,onChange){
  var tree={},es=new EventSource(DB+path+'.json');
  function h(kind){return function(ev){
    var m;try{m=JSON.parse(ev.data)}catch(e){return}
    if(!m)return;var keys;
    if(kind==='put'){tree=setAt(tree,m.path,m.data);keys=m.path==='/'?null:[m.path.split('/').filter(Boolean)[0]]}
    else{keys=Object.keys(m.data||{}).map(function(k){return k.split('/')[0]});Object.keys(m.data||{}).forEach(function(k){tree=setAt(tree,m.path+'/'+k,m.data[k])})}
    onChange(tree,keys,false);
  }}
  es.addEventListener('put',h('put'));es.addEventListener('patch',h('patch'));
  es.onerror=function(){onChange(null,null,true)};
}

  var ol=$('rank');ol.textContent='';
  if(!rows.length){var li=document.createElement('li');li.textContent='No players yet';ol.appendChild(li);return}
  rows.forEach(function(r,i){
    var li=document.createElement('li');
    li.textContent=(i===0?'🥇 ':i===1?'🥈 ':i===2?'🥉 ':'')+r.n+(r.me?' (you)':'');
    if(hostOn){
      var x=document.createElement('button');x.textContent=armedUid===r.u?'Remove?':'✕';if(armedUid===r.u)x.classList.add('p');x.title='Remove '+r.n;x.setAttribute('aria-label','Remove '+r.n);

      x.onclick=function(){
        if(armedUid!==r.u){armedUid=r.u;clearTimeout(armT2);armT2=setTimeout(function(){armedUid=null;board()},4000);board();return}
        armedUid=null;clearTimeout(armT2);
        delete players[r.u];board();
        var id=r.u,am=$('amsg');am.textContent='';
        api('/players/'+id,'PATCH',{name:null,count:null},true)
          .then(function(){return api('/players/'+id)})
          .then(function(v){if(v&&v.name)am.textContent=' The database kept '+r.n+'. Check the Realtime Database rules.'})
          .catch(function(e){am.textContent=' Couldn’t remove '+r.n+' ('+(e.message||'error')+'). Check the Realtime Database rules.'});
      };
      li.appendChild(x);
    }
    var s=document.createElement('span');s.className='n';s.textContent=r.c+' px';li.appendChild(s);ol.appendChild(li);
  });
}

colors.forEach(function(c,i){
  var b=document.createElement('button');b.className='sw'+(i?'':' on');b.style.background=c;b.setAttribute('aria-label',c);

  $('sws').appendChild(b);
});
$('eraser').onclick=function(){erase=!erase;$('eraser').classList.toggle('p',erase);if(erase)setPick(false);sched()};
function applyColor(c,fromSwatch){
  c=c.toLowerCase();color=c;erase=false;$('eraser').classList.remove('p');setPick(false);sched();
  [].forEach.call($('sws').children,function(x){x.classList.toggle('on',x.dataset.c===c)});

}

// ---- zoom & pan
function setZoom(z,cx,cy){
  z=Math.max(1,Math.min(20,z));
  var sr=stage.getBoundingClientRect();if(cx==null){cx=sr.left+sr.width/2;cy=sr.top+sr.height/2}
  var r=cv.getBoundingClientRect(),fx=(cx-r.left)/r.width,fy=(cy-r.top)/r.height;
  zoom=z;cv.style.width=(z*100)+'%';$('zl').textContent=Math.round(z*100)+'%';
  var r2=cv.getBoundingClientRect();
  stage.scrollLeft+=r2.left+fx*r2.width-cx;stage.scrollTop+=r2.top+fy*r2.height-cy;sched();
}
$('zi').onclick=function(){setZoom(zoom*1.5)};
$('zo').onclick=function(){setZoom(zoom/1.5)};
$('zr').onclick=function(){setZoom(1)};
stage.addEventListener('wheel',function(e){e.preventDefault();setZoom(zoom*Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0015)),e.clientX,e.clientY)},{passive:false});

function pos(e){var r=cv.getBoundingClientRect();return[Math.max(0,Math.min(299,Math.floor((e.clientX-r.left)*300/r.width))),Math.max(0,Math.min(99,Math.floor((e.clientY-r.top)*100/r.height)))]}
function span(q,n){var off=Math.floor((n-1)/2),x0=q[0]-off,y0=q[1]-off;return{x0:Math.max(0,x0),y0:Math.max(0,y0),x1:Math.min(300,x0+n),y1:Math.min(100,y0+n)}}
function cellKeys(q){var sp=span(q,BS),out=[];for(var y=sp.y0;y<sp.y1;y++)for(var x=sp.x0;x<sp.x1;x++)out.push(x+'_'+y);return out}
function place(q){
  if(!joined||!canDraw||!loaded)return;
  var W='#ffffff',upd={},keys=[],delta=0,skipped=0;
  var bad=function(){noteEl.textContent=' Couldn’t save that. Check your connection.'};
  cellKeys(q).forEach(function(k){
    var cur=pix[k],cc=colorOf(cur);
    if(erase){
      if(!cur)return;
      if(ownerOf(cur)!==uid){skipped++;return}
      delete pix[k];drawKey(k);upd[k]=null;keys.push(k);if(cc!==W)delta--;
      return;
    }
    if(cur&&cc!==W){skipped++;return}
    if(cc===color)return;
    var v={c:color,u:uid};pix[k]=v;drawKey(k);upd[k]=v;keys.push(k);if(color!==W)delta++;
  });
  if(skipped){
    if(BS===1)flash(erase?' You can only erase your own pixels.':' That pixel is already taken. Use the eraser on your own pixels.');
    else flash(erase?' Skipped '+skipped+' pixels that aren’t yours.':' Skipped '+skipped+' pixels that were already taken.');
  }
  if(!keys.length)return;
  var one=function(k){return upd[k]===null?api('/pixels/'+k,'DELETE'):api('/pixels/'+k,'PUT',upd[k])};
  var req=keys.length===1?one(keys[0]):api('/pixels','PATCH',upd).catch(function(){return Promise.all(keys.map(one))});
  req.catch(bad);
  if(delta)api('/players/'+uid+'/count','PUT',{'.sv':{increment:delta}}).catch(function(){});
}
var dn=null,ptrs={},pinch=null;
function pts(){return Object.keys(ptrs).map(function(k){return ptrs[k]})}
function base(p,m){return{x:p.x,y:p.y,sl:stage.scrollLeft,st:stage.scrollTop,m:m}}
cv.addEventListener('pointerdown',function(e){
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);
  var a=pts();
  if(a.length===1)dn=base(a[0],false);
  else{if(dn)dn.m=true;else dn=base(a[0],true);pinch=null}
});
cv.addEventListener('pointermove',function(e){
  if(!ptrs[e.pointerId])return;
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  var a=pts();
  if(a.length>=2){
    var d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2;
    if(!pinch)pinch={d:d||1,z:zoom,mx:mx,my:my};
    setZoom(pinch.z*d/pinch.d,mx,my);
    stage.scrollLeft+=pinch.mx-mx;stage.scrollTop+=pinch.my-my;
    pinch.mx=mx;pinch.my=my;if(dn)dn.m=true;return;
  }
  if(!dn)return;
  var dx=e.clientX-dn.x,dy=e.clientY-dn.y;
  if(Math.hypot(dx,dy)>6)dn.m=true;
  if(dn.m){stage.scrollLeft=dn.sl-dx;stage.scrollTop=dn.st-dy}
});
function lift(e){
  var tap=dn&&!dn.m&&Object.keys(ptrs).length===1&&e.type==='pointerup';
  delete ptrs[e.pointerId];pinch=null;
  var a=pts();
  if(a.length===1)dn=base(a[0],true);else if(!a.length)dn=null;
  if(tap){var q=pos(e);if((picking||e.altKey)&&joined)pickAt(q);else place(q)}
}
cv.addEventListener('pointerup',lift);cv.addEventListener('pointercancel',lift);

// ---- color picker, brush size, grid overlay
function setPick(on){picking=on;$('pick').classList.toggle('p',on);cv.classList.toggle('picking',on)}
function hex2(n){return (n<16?'0':'')+n.toString(16)}
function pickAt(q){
  var d=ctx.getImageData(q[0]*CS+Math.floor(CS/2),q[1]*CS+Math.floor(CS/2),1,1).data;
  applyColor('#'+hex2(d[0])+hex2(d[1])+hex2(d[2]),true);
}
$('pick').onclick=function(){
  var on=!picking;
  if(on){erase=false;$('eraser').classList.remove('p')}
  setPick(on);sched();
};
$('bs').oninput=function(){BS=Math.max(1,Math.min(15,+$('bs').value||1));$('bl').textContent=BS+'×'+BS;sched()};
$('gridbtn').onclick=function(){gridOn=!gridOn;$('gridbtn').classList.toggle('p',gridOn);sched()};

var ovQ=false;
function sched(){if(ovQ)return;ovQ=true;requestAnimationFrame(function(){ovQ=false;drawOv()})}
function drawOv(){
  var dpr=window.devicePixelRatio||1,w=stage.clientWidth,h=stage.clientHeight;
  var cw=Math.round(w*dpr),ch=Math.round(h*dpr);
  if(ov.width!==cw||ov.height!==ch){ov.width=cw;ov.height=ch}
  ov.style.left=(stage.offsetLeft+stage.clientLeft)+'px';ov.style.top=(stage.offsetTop+stage.clientTop)+'px';
  ov.style.width=w+'px';ov.style.height=h+'px';
  var g=ovx;g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  if(!joined)return;
  var r=cv.getBoundingClientRect(),sr=stage.getBoundingClientRect();
  var ox=r.left-sr.left-stage.clientLeft,oy=r.top-sr.top-stage.clientTop,s=r.width/300;
  function sn(v){return (Math.round(v*dpr)+.5)/dpr}
  if(gridOn&&s>=4){
    var i0=Math.max(0,Math.floor(-ox/s)),i1=Math.min(300,Math.ceil((w-ox)/s));
    var j0=Math.max(0,Math.floor(-oy/s)),j1=Math.min(100,Math.ceil((h-oy)/s));
    var xa=Math.max(0,ox),xb=Math.min(w,ox+300*s),ya=Math.max(0,oy),yb=Math.min(h,oy+100*s);
    g.lineWidth=1/dpr;
    [false,true].forEach(function(major){
      g.strokeStyle=major?'rgba(80,80,80,.7)':'rgba(120,120,120,.4)';
      g.beginPath();
      for(var i=i0;i<=i1;i++){if((i%10===0)!==major)continue;var x=sn(ox+i*s);g.moveTo(x,ya);g.lineTo(x,yb)}
      for(var j=j0;j<=j1;j++){if((j%10===0)!==major)continue;var y=sn(oy+j*s);g.moveTo(xa,y);g.lineTo(xb,y)}
      g.stroke();
    });
  }
  if(hv){
    var sp=span(hv,picking?1:BS);
    var px=ox+sp.x0*s,py=oy+sp.y0*s,rw=(sp.x1-sp.x0)*s,rh=(sp.y1-sp.y0)*s;
    if(!picking&&!erase){g.globalAlpha=.45;g.fillStyle=color;g.fillRect(px,py,rw,rh);g.globalAlpha=1}
    g.lineWidth=3;g.strokeStyle='rgba(255,255,255,.9)';g.strokeRect(px,py,rw,rh);
    g.lineWidth=1.5;g.strokeStyle=erase?'#e63946':'#1d9bf0';g.strokeRect(px,py,rw,rh);
  }
}
cv.addEventListener('pointermove',function(e){if(e.pointerType==='touch')return;hv=pos(e);sched()});
cv.addEventListener('pointerleave',function(){hv=null;sched()});
stage.addEventListener('scroll',sched);
window.addEventListener('resize',sched);
if(window.ResizeObserver)new ResizeObserver(sched).observe(stage);
sched();

// ---- timer / status
function tick(){
  var left=endsAt?endsAt-Date.now():null;
  if(endsAt===null){canDraw=true;statusEl.textContent='Drawing is open — no time limit'}
  else if(left>0){canDraw=true;var m=Math.floor(left/60000),s=Math.floor(left/1000)%60;statusEl.textContent='Drawing open — '+m+':'+(s<10?'0':'')+s+' left'}
  else{canDraw=false;statusEl.textContent='Drawing is locked'}
  if(loaded&&!joined)statusEl.textContent+=' · Watching only';
  cv.classList.toggle('locked',!canDraw||!joined);
}
setInterval(tick,500);tick();

$('dl').onclick=function(){
  cv.toBlob(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='twitter-banner.png';document.body.appendChild(a);a.click();a.remove()},'image/png');
};

function enter(){joined=true;$('gate').classList.add('hide');$('tools').style.display='flex';tick();sched()}
$('join').onclick=function(){

stream('/pixels',function(t,keys,err){

  else if(has&&!joined)enter();
  else if(gated&&!joined){gated=false;$('gmsg').textContent='Pick a name to join the lobby.';$('gform').classList.remove('hide')}

// ---- host controls (password)
var idTok=null,tokExp=0,refTok=null;
try{refTok=sessionStorage.getItem('hrt')}catch(e){}
function setTok(idt,rt,secs){idTok=idt;tokExp=Date.now()+(+secs||3600)*1000;if(rt){refTok=rt;try{sessionStorage.setItem('hrt',rt)}catch(e){}}}
function jsonOrErr(r){return r.json().then(function(j){if(!r.ok)throw new Error((j.error&&(j.error.message||j.error))||'error');return j})}
function getToken(){
  if(idTok&&tokExp-Date.now()>60000)return Promise.resolve(idTok);
  if(!refTok)return Promise.reject(new Error('Host is signed out'));
  return fetch('https://securetoken.googleapis.com/v1/token?key='+API_KEY,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(refTok)})
    .then(jsonOrErr).then(function(j){setTok(j.id_token,j.refresh_token,j.expires_in);return idTok});
}
function showAdmin(on){hostOn=on;$('admin').classList.toggle('hide',!on);$('hostrow').classList.toggle('hide',on);board()}
function dropSession(){idTok=null;refTok=null;tokExp=0;try{sessionStorage.removeItem('hrt')}catch(e){}}
$('hostbtn').onclick=function(){$('hostform').classList.toggle('hide');$('hem').focus()};
$('hgo').onclick=function(){
  var em=$('hem').value.trim(),pw=$('hpw').value,msg=$('hmsg');
  if(API_KEY.indexOf('PASTE')===0){msg.textContent=' Add your Firebase Web API key to the page first.';return}
  if(!em||!pw){msg.textContent=' Enter the host email and password.';return}
  msg.textContent=' Signing in…';
  fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+API_KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw,returnSecureToken:true})})
    .then(jsonOrErr)
    .then(function(j){setTok(j.idToken,j.refreshToken,j.expiresIn);$('hpw').value='';msg.textContent='';showAdmin(true)})
    .catch(function(e){msg.textContent=' Couldn’t sign in ('+e.message+').'});
};
$('hpw').addEventListener('keydown',function(e){if(e.key==='Enter')$('hgo').click()});
$('hem').addEventListener('keydown',function(e){if(e.key==='Enter')$('hgo').click()});
$('hout').onclick=function(){dropSession();showAdmin(false)};
if(refTok&&API_KEY.indexOf('PASTE')!==0)getToken().then(function(){showAdmin(true)}).catch(dropSession);

function setEnd(v){api('/config','PUT',v===null?null:{endsAt:v},true).catch(function(){noteEl.textContent=' Couldn’t update the timer.'})}
$('start').onclick=function(){var m=Math.max(1,+$('mins').value||10);setEnd(Date.now()+m*60000)};
$('lock').onclick=function(){setEnd(1)};
$('open').onclick=function(){setEnd(null)};
var armed=false,armT=null;
$('clear').onclick=async function(){
  var b=$('clear');
  if(!armed){armed=true;b.textContent='Tap again to erase everything';b.classList.add('p');armT=setTimeout(function(){armed=false;b.textContent='Clear banner';b.classList.remove('p')},4000);return}
  clearTimeout(armT);armed=false;b.textContent='Clearing…';
  try{
    await api('/pixels','DELETE',undefined,true);
    var upd={};Object.keys(players).forEach(function(u){upd[u+'/count']=0});
    if(Object.keys(upd).length)await api('/players','PATCH',upd,true);
    noteEl.textContent='';
  }catch(e){noteEl.textContent=' Couldn’t clear the banner: '+(e.message||'error')+'.'}
  b.textContent='Clear banner';b.classList.remove('p');
};

var upArmed=false,upT=null;
$('upg').onclick=async function(){
  var b=$('upg'),am=$('amsg');
  var olds=Object.keys(pix).filter(function(k){return typeof pix[k]==='string'});
  if(!olds.length){am.textContent=' Nothing to upgrade.';return}
  if(!upArmed){upArmed=true;b.textContent='Tap again to upgrade';b.classList.add('p');upT=setTimeout(function(){upArmed=false;b.textContent='Upgrade old art';b.classList.remove('p')},5000);return}
  clearTimeout(upT);upArmed=false;b.textContent='Upgrading…';am.textContent='';
  var out={};
  olds.forEach(function(k){
    var v=pix[k].toLowerCase();if(v==='#ffffff')return;
    var a=k.split('_'),x=a[0]*2,y=a[1]*2,o={c:v,u:'legacy'};
    [[0,0],[1,0],[0,1],[1,1]].forEach(function(d){out[(x+d[0])+'_'+(y+d[1])]=o});
  });
  Object.keys(pix).forEach(function(k){if(typeof pix[k]==='object')out[k]=pix[k]});
  try{await api('/pixels','PUT',out,true);am.textContent=' Old art upgraded.'}
  catch(e){am.textContent=' Upgrade failed ('+e.message+').'}
  b.textContent='Upgrade old art';b.classList.remove('p');
};
})();
</script>
<script>
(function(){
var m=document.getElementById('mascot');if(!m)return;
var SPEED=90,x=0,y=0,vx=0,vy=0,w=0,hh=0,last=0;
function vw(){return document.documentElement.clientWidth||window.innerWidth}
function vh(){return window.innerHeight}
function size(){w=m.offsetWidth;hh=m.offsetHeight;x=Math.min(Math.max(0,x),Math.max(0,vw()-w));y=Math.min(Math.max(0,y),Math.max(0,vh()-hh))}
function put(){m.style.transform='translate3d('+x+'px,'+y+'px,0)'}
function start(){
  size();
  x=Math.random()*Math.max(0,vw()-w);y=Math.random()*Math.max(0,vh()-hh);
  var a=Math.PI/4+Math.random()*Math.PI/6;
  vx=(Math.random()<.5?-1:1)*Math.cos(a)*SPEED;vy=(Math.random()<.5?-1:1)*Math.sin(a)*SPEED;
  put();m.style.visibility='visible';
  requestAnimationFrame(step);
}
function step(t){
  var dt=last?Math.min(.05,(t-last)/1000):0;last=t;
  var maxX=Math.max(0,vw()-w),maxY=Math.max(0,vh()-hh);
  x+=vx*dt;y+=vy*dt;
  if(x<=0){x=0;vx=Math.abs(vx)}else if(x>=maxX){x=maxX;vx=-Math.abs(vx)}
  if(y<=0){y=0;vy=Math.abs(vy)}else if(y>=maxY){y=maxY;vy=-Math.abs(vy)}
  put();requestAnimationFrame(step);
}
window.addEventListener('resize',function(){size();put()});
if(m.complete)start();else m.addEventListener('load',start);
})();
</script>
